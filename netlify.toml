[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "nodemailer"]

# Single-page app: serve index.html for any unknown path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
